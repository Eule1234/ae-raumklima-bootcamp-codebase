services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: raumklima
      MYSQL_USER: raumklima
      MYSQL_PASSWORD: raumklima
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "raumklima", "-praumklima"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      # Für Firmen-Proxy (z. B. Nexus + Suva-CA) hier ergänzen:
      #   CA_CERT_PATH: ./certs/suva-root.cer
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        CA_CERT_PATH: ${CA_CERT_PATH:-}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      USE_DB: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: raumklima
      MYSQL_PASSWORD: raumklima
      MYSQL_DATABASE: raumklima
      INGEST_API_KEY: ${INGEST_API_KEY:-esp-braucht-diesen-key}
      ALLOWED_ORIGINS: "*"
    ports:
      - "3000:3000"

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    ports:
      - "8080:80"

volumes:
  mysql-data:
