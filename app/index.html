<!DOCTYPE html>
<html lang="de">
<head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raumklima Monitor</title>
   <link rel="stylesheet" href="style.css">
   <script src="script.js" defer></script>
   <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

<main>
    <div class="header">
        <h1>Raumklima Monitor</h1>
    </div>

    <section class="dashboard">
    <div class="card" id="card">
        <div id="values">
        <div class="value-item">
            <div class="label">Sensor:</div>
            <div id="serial-number">SN 33421</div>
        </div>

        <div class="value-item">
            <div class="label">Temperatur:</div>
            <div id="tem-c" class="number">--°C</div> 
            </div>
        <div class="value-item">
            <div class="label">Luftfeuchtigkeit:</div>
            <div id="hum-pct" class="number">--%</div>
        </div>

    </div>
        <div class= "invisible" id="message">
            <p>Lade Daten...</p>
        </div>

    </div>

    <div class="card">
        <div class="value-item">
        <div class="label">Status:</div>
        <div id="status-gut">
        <div id="status" class="status gut">gut</div>
        </div>
        <div id="status-kritisch">
        <div id="status" class="status kritisch">kritisch</div>
        </div>
        <div id="status-schlecht">
        <div id="status" class="status schlecht">schlecht</div>
        </div>    
        <div class= "invisible" id="message">
            <p>Lade Daten...</p>
        </div>
        </div>
    </div>

    <div class="card" id="history-list">
        <div class="label">Verlauf:</div>
        <div id="history-item"></div>
    </div>

    <button onclick="loadData(); getStatus(); loadDashboard(); loadDashboard1();">Neu laden</button>
</section>
      <section class="admin-panel">
                <details>
                    <summary>Einstellungen</summary>
                    <div class="admin-content">
                        <label>
                            Sensor:
                            <select id="sensor-select" onchange="onSensorChange()">
                                <option value="SN12345">SN12345</option>
                                <option value="SN67890">SN67890</option>
                                <option value="DEMO-001">DEMO-001</option>
                            </select>
                        </label>
                        <button onclick="loadDashboard1()">Aktualisieren</button>
                    </div>
                </details>
            </section>
        </section>
</main>
<div class="footer">
    <p>AE Dashboard Projekt Bootcamp • Raumklima Monitor</p>
    <p>Erstellt von Lena G. • <a href="https://heiligerg.github.io/ae-raumklima-bootcamp/projekt/ueberblick/" target="_blank">GitHub Projektübersicht</a></p>
</div>

</body>
</html>
